<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F1FAF8"/><stop offset="1" stop-color="#E8F4FA"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#164756" flood-opacity=".12"/></filter>
</defs>
<rect width="1600" height="560" rx="30" fill="url(#bg)"/>
<text x="64" y="70" font-family="Microsoft JhengHei,Arial" font-size="34" font-weight="900" fill="#173E50">柴油車定期排氣檢驗｜5 步驟快速看懂</text>
<text x="64" y="105" font-family="Microsoft JhengHei,Arial" font-size="18" font-weight="700" fill="#698087">確認資格 → 確認期間 → 查詢預約 → 車況準備 → 到站完成排煙檢測</text>

<!-- connector -->
<path d="M205 329H1395" stroke="#B2D9D2" stroke-width="10" stroke-linecap="round"/>
<g fill="#48AD9C">
 <path d="M326 329l-25-18v36z"/><path d="M616 329l-25-18v36z"/><path d="M906 329l-25-18v36z"/><path d="M1196 329l-25-18v36z"/>
</g>

<!-- cards -->
<g font-family="Microsoft JhengHei,Arial" filter="url(#sh)">
 <!-- 1 -->
 <g transform="translate(50 135)">
  <rect width="270" height="350" rx="28" fill="#fff" stroke="#C9E3DD" stroke-width="3"/>
  <circle cx="45" cy="45" r="25" fill="#168A78"/><text x="37" y="54" font-size="25" font-weight="900" fill="#fff">1</text>
  <!-- truck -->
  <rect x="53" y="115" width="115" height="62" rx="13" fill="#4A91C1"/>
  <path d="M168 130h43l29 30v17h-72z" fill="#3478A8"/>
  <circle cx="84" cy="181" r="18" fill="#173D4A"/><circle cx="206" cy="181" r="18" fill="#173D4A"/>
  <circle cx="84" cy="181" r="7" fill="#C4DAD5"/><circle cx="206" cy="181" r="7" fill="#C4DAD5"/>
  <path d="M181 139h26l17 18h-43z" fill="#DDF2F8"/>
  <circle cx="110" cy="141" r="4" fill="#173D4A"/><circle cx="131" cy="141" r="4" fill="#173D4A"/>
  <path d="M114 151c5 5 10 5 15 0" stroke="#168A78" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="63" y="89" width="138" height="33" rx="11" fill="#E6F5F1"/>
  <text x="86" y="112" font-size="18" font-weight="900" fill="#168A78">確認資格</text>
  <text x="38" y="242" font-size="24" font-weight="900" fill="#173E50">確認是否需定檢</text>
  <text x="38" y="278" font-size="16" font-weight="700" fill="#72868B">先看官方系統或通知</text>
  <text x="38" y="305" font-size="16" font-weight="700" fill="#72868B">確認自己是否為對象</text>
 </g>

 <!-- 2 -->
 <g transform="translate(340 135)">
  <rect width="270" height="350" rx="28" fill="#fff" stroke="#C9E3DD" stroke-width="3"/>
  <circle cx="45" cy="45" r="25" fill="#168A78"/><text x="37" y="54" font-size="25" font-weight="900" fill="#fff">2</text>
  <!-- calendar -->
  <rect x="70" y="91" width="132" height="112" rx="18" fill="#EAF6F3" stroke="#7DCBBC" stroke-width="4"/>
  <rect x="70" y="91" width="132" height="34" rx="18" fill="#4AB49F"/>
  <path d="M100 78v27M171 78v27" stroke="#173E50" stroke-width="8" stroke-linecap="round"/>
  <text x="110" y="170" font-size="46" font-weight="900" fill="#173E50">±1</text>
  <text x="41" y="242" font-size="24" font-weight="900" fill="#173E50">確認檢驗期間</text>
  <text x="41" y="278" font-size="16" font-weight="700" fill="#72868B">依行照原發照月份</text>
  <text x="41" y="305" font-size="16" font-weight="700" fill="#72868B">前後各 1 個月辦理</text>
 </g>

 <!-- 3 -->
 <g transform="translate(630 135)">
  <rect width="270" height="350" rx="28" fill="#fff" stroke="#C9E3DD" stroke-width="3"/>
  <circle cx="45" cy="45" r="25" fill="#168A78"/><text x="37" y="54" font-size="25" font-weight="900" fill="#fff">3</text>
  <!-- phone + map pin -->
  <rect x="88" y="82" width="92" height="132" rx="17" fill="#173E50"/>
  <rect x="98" y="97" width="72" height="91" rx="8" fill="#DFF4F0"/>
  <circle cx="134" cy="201" r="7" fill="#C7DFD8"/>
  <path d="M135 112c-19 0-32 14-32 31 0 25 32 50 32 50s32-25 32-50c0-17-13-31-32-31z" fill="#F0A341"/>
  <circle cx="135" cy="143" r="11" fill="#fff"/>
  <text x="44" y="242" font-size="24" font-weight="900" fill="#173E50">查詢站點／預約</text>
  <text x="44" y="278" font-size="16" font-weight="700" fill="#72868B">使用環境部系統</text>
  <text x="44" y="305" font-size="16" font-weight="700" fill="#72868B">找柴動站並先預約</text>
 </g>

 <!-- 4 -->
 <g transform="translate(920 135)">
  <rect width="270" height="350" rx="28" fill="#fff" stroke="#C9E3DD" stroke-width="3"/>
  <circle cx="45" cy="45" r="25" fill="#168A78"/><text x="37" y="54" font-size="25" font-weight="900" fill="#fff">4</text>
  <!-- mechanic -->
  <circle cx="134" cy="119" r="38" fill="#FFD0B0"/>
  <path d="M98 113c6-35 51-42 72-10-20-10-48-8-72 10z" fill="#263E49"/>
  <circle cx="122" cy="121" r="4" fill="#263E49"/><circle cx="145" cy="121" r="4" fill="#263E49"/>
  <path d="M125 136c6 6 12 6 18 0" stroke="#B66054" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="100" y="158" width="69" height="61" rx="22" fill="#3E8FBC"/>
  <path d="M92 176L65 206M176 176l28 28" stroke="#FFD0B0" stroke-width="15" stroke-linecap="round"/>
  <path d="M51 206l26-25M53 184l25 25" stroke="#F0A341" stroke-width="7" stroke-linecap="round"/>
  <text x="46" y="242" font-size="24" font-weight="900" fill="#173E50">檢測前先保養</text>
  <text x="46" y="278" font-size="16" font-weight="700" fill="#72868B">確認無漏油、異音</text>
  <text x="46" y="305" font-size="16" font-weight="700" fill="#72868B">排氣系統保持正常</text>
 </g>

 <!-- 5 -->
 <g transform="translate(1210 135)">
  <rect width="270" height="350" rx="28" fill="#FFF9EA" stroke="#EACB7E" stroke-width="3"/>
  <circle cx="45" cy="45" r="25" fill="#E39A31"/><text x="37" y="54" font-size="25" font-weight="900" fill="#fff">5</text>
  <!-- test truck -->
  <rect x="45" y="125" width="103" height="55" rx="12" fill="#4A91C1"/>
  <path d="M148 137h38l26 26v17h-64z" fill="#3478A8"/>
  <circle cx="77" cy="184" r="17" fill="#173D4A"/><circle cx="178" cy="184" r="17" fill="#173D4A"/>
  <rect x="207" y="92" width="38" height="93" rx="8" fill="#173E50"/>
  <rect x="213" y="101" width="26" height="35" rx="4" fill="#CFF0E9"/>
  <path d="M212 158c-38 0-44 17-55 27" stroke="#566E75" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="224" cy="153" r="8" fill="#62C485"/>
  <text x="37" y="242" font-size="24" font-weight="900" fill="#173E50">到站完成檢驗</text>
  <text x="37" y="278" font-size="16" font-weight="700" fill="#72868B">依預約時間到場</text>
  <text x="37" y="305" font-size="16" font-weight="700" fill="#72868B">配合完成排煙檢測</text>
 </g>
</g>
</svg>