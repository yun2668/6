<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9F8F5"/><stop offset="1" stop-color="#E7F2FA"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#164756" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="760" rx="30" fill="url(#bg)"/>
<text x="65" y="72" font-family="Microsoft JhengHei,Arial" font-size="36" font-weight="900" fill="#173E50">新北「雙檢合一」｜一次到場，接續完成兩項檢驗</text>
<text x="65" y="110" font-family="Microsoft JhengHei,Arial" font-size="19" font-weight="700" fill="#688087">監理安全檢驗 → 柴油車排煙檢驗，減少車主往返時間</text>

<!-- first station -->
<g transform="translate(60 170)" filter="url(#sh)">
 <rect width="430" height="430" rx="32" fill="#fff" stroke="#CBE3DE" stroke-width="3"/>
 <circle cx="58" cy="58" r="30" fill="#3F8FC0"/><text x="49" y="69" font-family="Arial" font-size="31" font-weight="900" fill="#fff">1</text>
 <text x="108" y="67" font-family="Microsoft JhengHei,Arial" font-size="27" font-weight="900" fill="#173E50">監理安全檢驗</text>
 <!-- lane -->
 <rect x="50" y="300" width="330" height="72" rx="16" fill="#EAF1F2"/>
 <path d="M90 336H345" stroke="#B9CFD1" stroke-width="6" stroke-dasharray="20 14"/>
 <!-- truck -->
 <rect x="94" y="221" width="132" height="71" rx="13" fill="#4A91C1"/>
 <path d="M226 237h48l33 35v20h-81z" fill="#3478A8"/>
 <path d="M238 245h32l23 25h-55z" fill="#DDF2F8"/>
 <circle cx="126" cy="297" r="21" fill="#173D4A"/><circle cx="264" cy="297" r="21" fill="#173D4A"/>
 <circle cx="126" cy="297" r="8" fill="#C4DAD5"/><circle cx="264" cy="297" r="8" fill="#C4DAD5"/>
 <!-- clipboard -->
 <rect x="310" y="172" width="72" height="95" rx="10" fill="#FFF4D5" stroke="#D6A63B" stroke-width="4"/>
 <rect x="331" y="158" width="30" height="22" rx="6" fill="#D6A63B"/>
 <path d="M326 205l9 9 17-21M326 236l9 9 17-21" stroke="#45A978" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="58" y="407" font-family="Microsoft JhengHei,Arial" font-size="18" font-weight="700" fill="#687E84">先完成監理車輛安全檢驗</text>
</g>

<!-- arrow -->
<g transform="translate(510 330)">
 <circle cx="80" cy="50" r="66" fill="#168A78"/>
 <path d="M45 50H112M88 27l25 23-25 23" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="29" y="142" font-family="Microsoft JhengHei,Arial" font-size="20" font-weight="900" fill="#168A78">接續辦理</text>
</g>

<!-- second station -->
<g transform="translate(690 170)" filter="url(#sh)">
 <rect width="450" height="430" rx="32" fill="#FFF9E9" stroke="#E7CD87" stroke-width="3"/>
 <circle cx="58" cy="58" r="30" fill="#E39A31"/><text x="49" y="69" font-family="Arial" font-size="31" font-weight="900" fill="#fff">2</text>
 <text x="108" y="67" font-family="Microsoft JhengHei,Arial" font-size="27" font-weight="900" fill="#173E50">柴油車排煙檢驗</text>
 <!-- truck -->
 <rect x="56" y="225" width="132" height="70" rx="13" fill="#4A91C1"/>
 <path d="M188 239h47l34 36v20h-81z" fill="#3478A8"/>
 <path d="M199 247h32l23 26h-55z" fill="#DDF2F8"/>
 <circle cx="89" cy="299" r="21" fill="#173D4A"/><circle cx="227" cy="299" r="21" fill="#173D4A"/>
 <circle cx="89" cy="299" r="8" fill="#C4DAD5"/><circle cx="227" cy="299" r="8" fill="#C4DAD5"/>
 <!-- machine -->
 <rect x="296" y="186" width="100" height="133" rx="15" fill="#173E50"/>
 <rect x="311" y="202" width="70" height="45" rx="7" fill="#DDF4EF"/>
 <path d="M321 235l12-12 15 8 16-18 13 7" stroke="#49B69F" stroke-width="5" fill="none" stroke-linecap="round"/>
 <circle cx="325" cy="277" r="13" fill="#F0C84A"/><circle cx="365" cy="277" r="13" fill="#60BF7D"/>
 <path d="M296 300c-43 3-57-1-76-17" stroke="#596E75" stroke-width="9" fill="none" stroke-linecap="round"/>
 <!-- happy inspector -->
 <circle cx="342" cy="350" r="32" fill="#FFD0B0"/>
 <path d="M313 346c5-27 39-32 56-7-17-8-37-7-56 7z" fill="#263E49"/>
 <circle cx="333" cy="352" r="4" fill="#263E49"/><circle cx="351" cy="352" r="4" fill="#263E49"/>
 <path d="M335 364c5 5 10 5 15 0" stroke="#B66054" stroke-width="3" fill="none" stroke-linecap="round"/>
 <text x="60" y="407" font-family="Microsoft JhengHei,Arial" font-size="18" font-weight="700" fill="#687E84">完成安全檢驗後，再接續排煙檢測</text>
</g>

<!-- bottom badge -->
<g transform="translate(375 635)">
 <rect width="450" height="72" rx="24" fill="#173E50"/>
 <circle cx="52" cy="36" r="21" fill="#60BF7D"/>
 <path d="M42 36l7 7 14-18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="90" y="45" font-family="Microsoft JhengHei,Arial" font-size="23" font-weight="900" fill="#fff">少跑一趟・流程更順・定檢免費</text>
</g>
</svg>