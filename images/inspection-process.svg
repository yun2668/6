<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f4fafb"/>
<text x="70" y="82" font-family="Microsoft JhengHei, Arial" font-size="42" font-weight="700" fill="#123f4f">柴油車排煙檢驗流程</text>
<text x="70" y="126" font-family="Microsoft JhengHei, Arial" font-size="22" fill="#6b838c">先確認資格與期間，再預約、到站、完成檢測</text>
<g font-family="Microsoft JhengHei, Arial">
  <g transform="translate(70 190)">
    <rect width="210" height="350" rx="28" fill="#ffffff" stroke="#dbe8eb" stroke-width="2"/>
    <circle cx="105" cy="88" r="45" fill="#e7f6f3"/><text x="105" y="102" text-anchor="middle" font-size="42">📄</text>
    <text x="105" y="165" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">1. 確認資格</text>
    <text x="105" y="207" text-anchor="middle" font-size="17" fill="#667e87">確認是否為</text>
    <text x="105" y="237" text-anchor="middle" font-size="17" fill="#667e87">柴油車定檢對象</text>
  </g>
  <text x="312" y="372" font-size="48" fill="#43b6a8">→</text>
  <g transform="translate(350 190)">
    <rect width="210" height="350" rx="28" fill="#ffffff" stroke="#dbe8eb" stroke-width="2"/>
    <circle cx="105" cy="88" r="45" fill="#eaf3f8"/><text x="105" y="102" text-anchor="middle" font-size="42">📅</text>
    <text x="105" y="165" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">2. 看檢驗期</text>
    <text x="105" y="207" text-anchor="middle" font-size="17" fill="#667e87">原發照月份</text>
    <text x="105" y="237" text-anchor="middle" font-size="17" fill="#667e87">前後各 1 個月</text>
  </g>
  <text x="592" y="372" font-size="48" fill="#43b6a8">→</text>
  <g transform="translate(630 190)">
    <rect width="210" height="350" rx="28" fill="#ffffff" stroke="#dbe8eb" stroke-width="2"/>
    <circle cx="105" cy="88" r="45" fill="#edf8f6"/><text x="105" y="102" text-anchor="middle" font-size="42">📍</text>
    <text x="105" y="165" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">3. 預約到站</text>
    <text x="105" y="207" text-anchor="middle" font-size="17" fill="#667e87">選擇排煙站</text>
    <text x="105" y="237" text-anchor="middle" font-size="17" fill="#667e87">依預約時間到場</text>
  </g>
  <text x="872" y="372" font-size="48" fill="#43b6a8">→</text>
  <g transform="translate(910 190)">
    <rect width="210" height="350" rx="28" fill="#ffffff" stroke="#dbe8eb" stroke-width="2"/>
    <circle cx="105" cy="88" r="45" fill="#e7f6f3"/><text x="105" y="102" text-anchor="middle" font-size="42">✅</text>
    <text x="105" y="165" text-anchor="middle" font-size="23" font-weight="700" fill="#173b48">4. 完成檢驗</text>
    <text x="105" y="207" text-anchor="middle" font-size="17" fill="#667e87">合格完成</text>
    <text x="105" y="237" text-anchor="middle" font-size="17" fill="#667e87">不合格先修復複驗</text>
  </g>
</g>
<rect x="70" y="585" width="1050" height="76" rx="18" fill="#fff6df"/>
<text x="98" y="632" font-family="Microsoft JhengHei, Arial" font-size="20" font-weight="700" fill="#7a5c1c">提醒：實際資格、期限及預約結果，仍以環境部系統與主管機關通知為準。</text>
</svg>